# MHI bus debug logging — OnePlus 8T (kebab)
#
# The modem bring-up on this board was done almost entirely by reading MHI
# state transitions, so the mhi module is loaded with every dev_dbg site
# enabled. That is a deliberate choice, not an accident, and it is the
# reason dmesg carries lines like:
#
#   mhi mhi0: Received EE event: MISSION MODE
#   mhi mhi0: Power on setup success
#   mhi mhi1: State change event to state: M0
#   mhi mhi0: Marking all events for chan: 10 as stale
#
# It costs about 35 lines per boot. Most of them are the SDX55 boot trace
# (mhi0) and the QCA6390 Wi-Fi/BT runtime-PM transitions (mhi1), and they
# are the first thing to look at whenever the modem does not reach mission
# mode. CONFIG_MHI_BUS_DEBUG has nothing to do with it — that option only
# adds the debugfs interface and enables no prints at all.
#
# To turn it off, comment out the line below and reboot (or, without a
# reboot: `echo 'module mhi -p' | sudo tee /sys/kernel/debug/dynamic_debug/control`).
# Error and warning paths in the mhi driver are not dev_dbg, so nothing
# that reports an actual failure is lost by turning this off.
#
# Note: a hand-placed /etc/modprobe.d/mhi.conf from the original bring-up
# takes precedence over this file. Remove it so this one governs.
options mhi dyndbg=+p
