# OnePlus 8T (kebab)
#
# WCD9385 over SoundWire through the LPASS rx/tx macros.
# Playback on MultiMedia1 (hw:0,0), capture on MultiMedia2 (hw:0,1).
#
# KNOWN LIMITATIONS ON THIS BOARD -- see README for the evidence:
#
#   RESOLVED 2026-09-15: the loudspeakers work. The two NXP TFA9874
#   amplifiers on tertiary MI2S are driven by the out-of-tree tfa2 codec
#   driver (CONFIG_SND_SOC_TFA2), with the tertiary MI2S pads muxed to
#   mi2s2_sck/ws/data1 and the RX port on SD1 -- see the Speaker device
#   below. The earlier "six routings, all silent" result was the WCD
#   codec being routed to transducers that are not wired to it.
#
#   RESOLVED 2026-09-16: capture works. The earlier "dies after 1.6 s with
#   EIO at -66 dBFS" result was the WCD analogue path; kebab's built-in
#   mics are digital and belong to the VA macro -- see the Mic device
#   below. PipeWire exposes it as HiFi__Mic__source.
#
# There is deliberately NO Earpiece device. On this board the earpiece is
# the second stereo transducer and is driven by the second TFA9874 amp, not
# by the WCD -- so a WCD-routed "Earpiece" points at hardware that is not
# wired to it. It also shared hw:0,0 with Speaker at a different channel
# count, which made PipeWire respawn a failing Earpiece node in a loop
# (prepare returning -EINVAL, "Routing not setup for MultiMedia-1").
# Both transducers are covered by the stereo Speaker device below.
# Note: callaudiod wants an earpiece port, so in-call routing will need
# revisiting when the modem is usable.

SectionVerb {

	EnableSequence [
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	# The two NXP TFA9874 amplifiers on tertiary MI2S. This single mixer
	# control is the whole difference between silence and sound: without it
	# the MI2S backend is never enabled, so no bit clock reaches the amps and
	# they sit at CLKS=0 forever. Nothing else sets it, and alsa-restore
	# happily restores it as "off", which is why the speaker used to work
	# only sporadically.
	EnableSequence [
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Internal microphone (LPASS DMIC via VA macro)"

	# kebab's built-in mics are DIGITAL mics on the LPI pins (gpio6/gpio7,
	# dmic1_clk/dmic1_data), not analog capsules on AMIC1.  Stock
	# mixer_paths.xml maps "handset-mic" -> dmic2 -> DMIC index 1.
	#
	# Stock records via the TX macro (TX DMIC MUX2), but in mainline only
	# lpass-va-macro implements the DMIC clock (va_dmic_clk_enable /
	# CDC_VA_TOP_CSR_DMICn_CTL); lpass-tx-macro has the MSM_DMIC routes but no
	# clock code at all.  So we capture through the VA macro instead.
	EnableSequence [
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 1"
		cset "name='VA_AIF1_CAP Mixer DEC0' 1"
		cset "name='VA DEC0 MUX' VA_DMIC"
		cset "name='VA DMIC MUX0' DMIC1"
		cset "name='VA_DEC0 Volume' 100"
	]

	DisableSequence [
		cset "name='VA DMIC MUX0' ZERO"
		cset "name='VA_AIF1_CAP Mixer DEC0' 0"
		cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
	}
}
